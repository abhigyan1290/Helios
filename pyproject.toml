[build-system]
requires = ["scikit-build-core>=0.10,<1", "pybind11>=2.12,<4"]
build-backend = "scikit_build_core.build"

[project]
name = "helios-simulator"
version = "0.1.0"
description = "C++ discrete-event cluster scheduling simulator"
requires-python = ">=3.11"
dependencies = ["gymnasium>=1.0,<2", "numpy>=1.24"]

[project.optional-dependencies]
rl = ["stable-baselines3>=2.7,<3", "sb3-contrib>=2.7,<3", "matplotlib>=3.8"]

[tool.scikit-build]
wheel.packages = ["python/helios"]
cmake.args = ["-DHELIOS_BUILD_PYTHON=ON"]
