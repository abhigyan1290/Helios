[build-system]
requires = ["scikit-build-core>=0.10,<1", "pybind11>=2.12,<4"]
build-backend = "scikit_build_core.build"

[project]
name = "helios-simulator"
version = "0.1.0"
description = "C++ discrete-event cluster scheduling simulator"
requires-python = ">=3.11"

[tool.scikit-build]
wheel.packages = ["python/helios"]
cmake.args = ["-DHELIOS_BUILD_PYTHON=ON"]
